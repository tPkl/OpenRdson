[package]
name = "openrdson-solver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenRDSon numerical field solver (FEM Laplace, sparse CG)"

[dependencies]
openrdson-core = { workspace = true }
# Optional, benchmark-only: compare the in-house IC(0)-PCG against faer's
# sparse Cholesky. Enabled with `--features bench-faer`; the default build
# stays dependency-free.
faer = { version = "0.24", default-features = false, features = ["std", "sparse", "sparse-linalg"], optional = true }

[features]
bench-faer = ["dep:faer"]
# Use faer's sparse Cholesky for the 2D sheet-network solves (see
# `solve_dirichlet_direct`). The 3D FEM keeps the in-house IC(0)-PCG, which is
# faster there. Off by default to keep the tool dependency-free.
faer-sheet = ["dep:faer"]

[dev-dependencies]
openrdson-geometry = { path = "../geometry" }
openrdson-meshing = { path = "../meshing" }

[[example]]
name = "solve_bench"
required-features = ["bench-faer"]
